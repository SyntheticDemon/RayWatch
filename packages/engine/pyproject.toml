[project]
name = "raywatch-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["raywatch-model", "psycopg[binary]>=3.2"]

[tool.uv.sources]
raywatch-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raywatch/engine"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]
