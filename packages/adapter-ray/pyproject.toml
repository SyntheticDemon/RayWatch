[project]
name = "raywatch-adapter-ray"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["raywatch-model", "httpx>=0.28"]

[tool.uv.sources]
raywatch-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raywatch/adapter_ray"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]
