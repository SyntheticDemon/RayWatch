[project]
name = "raywatch-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raywatch/model"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]
