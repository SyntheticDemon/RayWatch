name: Verify live Ray stack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: make verify-live
