[project]
name = "raywatch-collector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "raywatch-model",
    "raywatch-engine",
    "raywatch-adapter-ray",
]

[tool.uv.sources]
raywatch-model = { workspace = true }
raywatch-engine = { workspace = true }
raywatch-adapter-ray = { workspace = true }

[project.scripts]
raywatch-collector = "raywatch.collector.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raywatch/collector"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]
