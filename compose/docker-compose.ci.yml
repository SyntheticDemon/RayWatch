# CI integration: build API image and run pytest integration marker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raywatch
      POSTGRES_PASSWORD: raywatch
      POSTGRES_DB: raywatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raywatch"]
      interval: 3s
      timeout: 3s
      retries: 10

  ray-head:
    image: rayproject/ray:2.44.1-py312
    command: >
      ray start --head --disable-usage-stats
      && sleep infinity
    shm_size: "2gb"

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ci
    environment:
      DATABASE_URL: postgresql://raywatch:raywatch@postgres:5432/raywatch
      RAY_ADDRESS: ray://ray-head:10001
    depends_on:
      postgres:
        condition: service_healthy
      ray-head:
        condition: service_started
    command: ["uv", "run", "pytest", "-m", "integration", "-v"]
